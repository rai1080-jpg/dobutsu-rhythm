<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#9fdcff">
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="どうぶつたちと いっしょに えんそうする リズムゲーム">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="どうぶつリズム">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
/* keep clear of the notch / home bar when launched from the home screen */
html{background:#bfe6ff}
body{box-sizing:border-box;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
</style>
</head>
<body>
<title>どうぶつリズムパーティー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<style>
:root{
  --ink:#5b3348; --ink-soft:#8d6478;
  --pink:#ff6fa5; --pink-d:#d6407f;
  --sun:#ffc93c; --sun-d:#e09b00;
  --mint:#43c59e; --sky:#5aa9ff;
  --paper:#fff9fc;
  --l0:#ff7aa8; --l1:#ffb020; --l2:#43c59e; --l3:#5aa9ff;
  --display:'Mochiy Pop One','Hiragino Maru Gothic ProN','Yu Gothic UI','Meiryo',sans-serif;
  --body:'Zen Maru Gothic','Hiragino Maru Gothic ProN','Yu Gothic UI','Meiryo',sans-serif;
  --beat:.6s;
  --sky1:#9fdcff; --sky2:#ffe6f2;
  --padD:80px;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;touch-action:none;overscroll-behavior:none;-webkit-touch-callout:none;-webkit-text-size-adjust:100%}
body{background:#bfe6ff;color:var(--ink);font-family:var(--body);font-weight:700;overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font-family:inherit}
[hidden]{display:none!important}
#app{position:relative;width:100%;height:100%;overflow:hidden;
  background:linear-gradient(180deg,var(--sky1) 0%,var(--sky2) 78%);transition:background 1s}

/* ---------- scenery ---------- */
#bg{position:absolute;inset:0;pointer-events:none;overflow:hidden}
#bg .sun{position:absolute;right:9%;top:8%;width:clamp(70px,14vmin,140px);aspect-ratio:1;border-radius:50%;
  background:radial-gradient(circle,#fff6b8 30%,#ffe066 62%,rgba(255,224,102,0) 71%);animation:spin 40s linear infinite}
#bg .cloud{position:absolute;height:clamp(28px,7vmin,60px);width:clamp(90px,22vmin,190px);background:#fff;border-radius:999px;opacity:.9;animation:drift linear infinite}
#bg .cloud::before,#bg .cloud::after{content:"";position:absolute;background:#fff;border-radius:50%}
#bg .cloud::before{width:46%;aspect-ratio:1;left:14%;top:-42%}
#bg .cloud::after{width:36%;aspect-ratio:1;left:46%;top:-30%}
#bg .c1{top:14%;animation-duration:70s;left:-20%}
#bg .c2{top:34%;animation-duration:95s;animation-delay:-40s;left:-20%;transform:scale(.7)}
#bg .c3{top:22%;animation-duration:120s;animation-delay:-80s;left:-20%;transform:scale(1.1)}
#bg .hill{position:absolute;bottom:-8%;border-radius:50%}
#bg .h1{left:-15%;width:75%;height:34%;background:#9be3a6}
#bg .h2{right:-20%;width:85%;height:28%;background:#7fd493;bottom:-10%}
#bg .rainbow{position:absolute;inset:0;opacity:0;transition:opacity .8s;
  background:linear-gradient(90deg,rgba(255,111,165,.35),rgba(255,201,60,.35),rgba(67,197,158,.35),rgba(90,169,255,.35),rgba(185,140,255,.35),rgba(255,111,165,.35));
  background-size:300% 300%;animation:shift 6s linear infinite}
#app.fever #bg .rainbow{opacity:1}
@keyframes drift{to{translate:150vw 0}}
@keyframes spin{to{rotate:360deg}}
@keyframes shift{to{background-position:300% 0}}

/* ---------- play layout ---------- */
#play{position:absolute;inset:0;display:grid;grid-template-columns:1fr minmax(280px,min(520px,100vw)) 1fr;align-items:stretch}
#left,#right{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:0 12px 18px;min-width:0}
#girlHost{height:min(72vh,460px);aspect-ratio:260/380;max-width:100%}
#girlHost svg,#titleGirl svg{width:100%;height:100%;overflow:visible}
#bubble{max-width:min(260px,90%);background:#fff;border-radius:22px;padding:10px 16px;font-size:clamp(15px,2.6vmin,20px);line-height:1.35;text-align:center;
  box-shadow:0 4px 0 rgba(91,51,72,.12);position:relative;margin-bottom:14px;min-height:2.6em;display:flex;align-items:center;justify-content:center}
#bubble::after{content:"";position:absolute;bottom:-9px;left:50%;translate:-50% 0;border:10px solid transparent;border-bottom:0;border-top-color:#fff}
#bubble.pop{animation:bpop .35s}
@keyframes bpop{0%{scale:.85}60%{scale:1.08}100%{scale:1}}
#friends{display:grid;grid-template-columns:1fr 1fr;gap:clamp(8px,2vmin,20px);width:min(300px,100%);margin-bottom:8px}
.friend{aspect-ratio:1;animation:hop calc(var(--beat)*2) ease-in-out infinite alternate;position:relative}
.friend:nth-child(even){animation-direction:alternate-reverse}
.friend svg{width:100%;height:100%;overflow:visible;filter:drop-shadow(0 6px 0 rgba(91,51,72,.12))}
.friend.cheer{animation:none;translate:0 -14px;scale:1.16;transition:translate .08s,scale .08s}
.friend .say{position:absolute;left:50%;top:-6px;translate:-50% 0;font-family:var(--display);font-size:clamp(14px,2.4vmin,20px);color:var(--l1);opacity:0;pointer-events:none}
.friend.cheer .say{animation:say .5s}
@keyframes say{0%{opacity:1;translate:-50% 0}100%{opacity:0;translate:-50% -30px}}
@keyframes hop{from{translate:0 0}to{translate:0 -8px}}

#lanesWrap{position:relative;margin:clamp(6px,1.6vmin,16px) 0;border-radius:28px;background:rgba(255,255,255,.58);
  box-shadow:0 0 0 4px rgba(255,255,255,.75),0 12px 30px rgba(91,51,72,.15);overflow:hidden}
#lanes{position:absolute;inset:0;display:flex}
#cv{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.lane{position:relative;flex:1;touch-action:none;cursor:pointer}
.pad{position:absolute;left:50%;bottom:10px;width:var(--padD);height:var(--padD);translate:-50% 0;border-radius:50%;
  background:rgba(255,255,255,.55);border:5px dashed var(--c);display:flex;align-items:center;justify-content:center;transition:transform .07s,background .07s}
.pad svg{width:78%;height:78%;opacity:.55;transition:opacity .07s}
.lane.down .pad{transform:scale(.88);background:#fff;box-shadow:0 0 0 8px color-mix(in srgb,var(--c) 45%,transparent)}
.lane.down .pad svg{opacity:1}
.key{position:absolute;left:50%;bottom:calc(10px + var(--padD) + 4px);translate:-50% 0;font-family:var(--display);font-size:14px;color:var(--ink-soft);
  background:#fff;border-radius:8px;padding:1px 9px;box-shadow:0 2px 0 rgba(91,51,72,.15);display:none}
@media (hover:hover) and (pointer:fine){.key{display:block}}
#hud{position:absolute;left:0;right:0;top:0;padding:10px 14px 0;display:flex;align-items:center;gap:10px;pointer-events:none;z-index:3}
#bgmBtn{position:absolute;top:10px;right:10px;z-index:30;font-family:var(--display);font-size:13px;border:0;border-radius:999px;padding:.45em .9em;
  background:#fff;color:var(--pink-d);box-shadow:0 3px 0 rgba(91,51,72,.18);cursor:pointer}
#bgmBtn.off{color:var(--ink-soft);background:#f3eef1}
#bgmBtn:focus-visible{outline:4px solid var(--sky);outline-offset:3px}
#title,#select,#wardrobe,#save{padding-top:52px}
.savecard{background:#fff;border-radius:22px;padding:14px 16px;display:flex;flex-direction:column;align-items:center;gap:10px;width:min(480px,100%);box-shadow:0 5px 0 rgba(91,51,72,.12)}
.savelabel{font-size:14px;color:var(--ink-soft)}
#saveCode{font-family:var(--display);font-size:clamp(20px,5.6vw,28px);letter-spacing:.06em;line-height:1.6;text-align:center;word-break:break-all;color:var(--pink-d);
  -webkit-user-select:text;user-select:text}
#loadCode{width:100%;font-family:var(--body);font-weight:700;font-size:18px;text-align:center;padding:.6em .8em;border-radius:14px;border:3px solid #f0d3e2;color:var(--ink);background:#fff;
  -webkit-user-select:text;user-select:text;touch-action:manipulation}
#loadCode:focus-visible{outline:4px solid var(--sky);outline-offset:2px}
#saveMsg.ok{background:#e3f8ee}#saveMsg.ng{background:#ffe6ec}   /* room for the music button */
#pauseBtn{pointer-events:auto;width:40px;height:40px;border-radius:50%;border:0;background:#fff;color:var(--ink);font-size:16px;font-weight:900;
  box-shadow:0 3px 0 rgba(91,51,72,.2);cursor:pointer;flex:none}
#prog{flex:1;height:12px;background:rgba(255,255,255,.85);border-radius:999px;overflow:hidden;box-shadow:inset 0 0 0 2px rgba(91,51,72,.08)}
#progFill{height:100%;width:0;background:linear-gradient(90deg,var(--pink),var(--sun),var(--mint),var(--sky));border-radius:999px}
#score{font-family:var(--display);font-size:clamp(18px,3.2vmin,26px);color:var(--pink-d);font-variant-numeric:tabular-nums;min-width:4.4em;text-align:right;-webkit-text-stroke:5px #fff;paint-order:stroke fill}
#combo{position:absolute;left:0;right:0;top:15%;text-align:center;pointer-events:none;z-index:2;font-family:var(--display);color:var(--sun);
  -webkit-text-stroke:9px #fff;paint-order:stroke fill;filter:drop-shadow(0 5px 0 rgba(214,64,127,.35));opacity:0}
#combo b{display:block;font-size:clamp(54px,12vmin,96px);line-height:1;font-weight:400}
#combo span{display:block;margin-top:.5em;font-size:clamp(18px,3.4vmin,26px);color:var(--pink)}
#combo.on{opacity:1}
#combo.pop b{animation:cpop .16s}
@keyframes cpop{0%{scale:1.35}100%{scale:1}}
#judge{position:absolute;left:0;right:0;pointer-events:none;text-align:center;z-index:2;font-family:var(--display);font-size:clamp(22px,4.6vmin,36px);
  -webkit-text-stroke:7px #fff;paint-order:stroke fill;opacity:0}
#judge.show{animation:jshow .55s ease-out}
@keyframes jshow{0%{opacity:1;scale:.6;translate:0 6px}25%{scale:1.15;opacity:1}100%{opacity:0;translate:0 -26px;scale:1}}
#count{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:4;font-family:var(--display);
  font-size:clamp(70px,20vmin,140px);color:var(--pink);-webkit-text-stroke:12px #fff;paint-order:stroke fill;filter:drop-shadow(0 6px 0 rgba(214,64,127,.3))}
#count.tick{animation:ctick .5s ease-out}
@keyframes ctick{0%{scale:1.6;opacity:0}30%{opacity:1}100%{scale:1}}

/* ---------- girl animation ---------- */
.girl .g-happy,.girl .g-open,.girl .g-oops,.girl .g-sweat{display:none}
.girl.s-happy .g-eyes-n{display:none}.girl.s-happy .g-happy{display:inline}
.girl.s-happy .g-mouth-n{display:none}.girl.s-happy .g-open{display:inline}
.girl.s-oops .g-mouth-n{display:none}.girl.s-oops .g-oops{display:inline}.girl.s-oops .g-sweat{display:inline}
.girl .body,.girl .head,.girl .armL,.girl .armR,.girl .tailL,.girl .tailR{transform-box:view-box}
.girl.dance .body{animation:gbob var(--beat) ease-in-out infinite alternate}
.girl.dance .head{transform-origin:130px 170px;animation:gtilt calc(var(--beat)*2) ease-in-out infinite alternate}
.girl.dance .armL{transform-origin:96px 212px;animation:garmL calc(var(--beat)*2) ease-in-out infinite alternate}
.girl.dance .armR{transform-origin:164px 212px;animation:garmR calc(var(--beat)*2) ease-in-out infinite alternate}
.girl.dance .tailL{transform-origin:80px 160px;animation:gtailL calc(var(--beat)*2) ease-in-out infinite alternate}
.girl.dance .tailR{transform-origin:190px 90px;animation:gtailR calc(var(--beat)*2) ease-in-out infinite alternate}
@keyframes gbob{from{translate:0 0}to{translate:0 -9px}}
@keyframes gtilt{from{rotate:-4deg}to{rotate:4deg}}
@keyframes garmL{from{rotate:-18deg}to{rotate:26deg}}
@keyframes garmR{from{rotate:-26deg}to{rotate:18deg}}
@keyframes gtailL{from{rotate:4deg}to{rotate:-5deg}}
@keyframes gtailR{from{rotate:8deg}to{rotate:-6deg}}
.girl.jump{animation:gjump .6s ease-out}
@keyframes gjump{0%{translate:0 0}35%{translate:0 -38px;scale:1.05}100%{translate:0 0}}

/* ---------- screens ---------- */
.screen{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(10px,2.4vmin,22px);
  padding:16px;overflow:auto;text-align:center;touch-action:pan-y}
.screen::before,.screen::after{content:"";margin:auto;flex:none}   /* centre when short, scroll from the top when tall */
.screen{justify-content:flex-start}
.screen.veil{background:rgba(255,249,252,.8);backdrop-filter:blur(6px)}
.btn{font-family:var(--display);font-size:clamp(20px,4.2vmin,30px);font-weight:400;color:#fff;background:var(--pink);border:0;border-radius:999px;
  padding:.55em 1.6em;box-shadow:0 6px 0 var(--pink-d),0 14px 22px rgba(214,64,127,.28);cursor:pointer;text-shadow:0 2px 0 rgba(0,0,0,.14);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(5px);box-shadow:0 1px 0 var(--pink-d)}
.btn.sun{background:var(--sun);color:#7a4a00;text-shadow:none;box-shadow:0 6px 0 var(--sun-d),0 14px 22px rgba(224,155,0,.28)}
.btn.sun:active{box-shadow:0 1px 0 var(--sun-d)}
.btn.ghost{background:#fff;color:var(--ink);text-shadow:none;box-shadow:0 5px 0 rgba(91,51,72,.2)}
.btn.small{font-size:clamp(15px,2.6vmin,19px);padding:.5em 1.2em}
.btn:focus-visible,.song:focus-visible,.outfit:focus-visible,#pauseBtn:focus-visible{outline:4px solid var(--sky);outline-offset:3px}
.row{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
h2.ttl{margin:0;font-family:var(--display);font-weight:400;font-size:clamp(26px,5.6vmin,42px);color:var(--pink-d);-webkit-text-stroke:8px #fff;paint-order:stroke fill}

#title .logo{font-family:var(--display);font-weight:400;line-height:1.05;margin:0;-webkit-text-stroke:10px #fff;paint-order:stroke fill;filter:drop-shadow(0 6px 0 rgba(214,64,127,.25))}
#title .l1{font-size:clamp(46px,13vmin,110px);display:flex;justify-content:center}
#title .l2{font-size:clamp(26px,7.4vmin,60px);color:var(--sky)}
#title .l1 span{display:inline-block;animation:lhop 1.6s ease-in-out infinite}
#title .l1 span:nth-child(1){color:var(--pink);animation-delay:0s}
#title .l1 span:nth-child(2){color:var(--sun);animation-delay:.12s}
#title .l1 span:nth-child(3){color:var(--mint);animation-delay:.24s}
#title .l1 span:nth-child(4){color:var(--sky);animation-delay:.36s}
@keyframes lhop{0%,60%,100%{translate:0 0}30%{translate:0 -14px}}
#titleCast{display:flex;align-items:flex-end;justify-content:center;gap:clamp(4px,1.6vmin,16px);height:clamp(150px,34vh,300px);width:100%}
#titleCast .an{width:clamp(56px,15vmin,130px);animation:hop .6s ease-in-out infinite alternate}
#titleCast .an:nth-child(odd){animation-direction:alternate-reverse}
#titleCast .an svg{width:100%;display:block;filter:drop-shadow(0 6px 0 rgba(91,51,72,.12))}
#titleGirl{height:100%;aspect-ratio:260/380}
.howto{background:rgba(255,255,255,.85);border-radius:20px;padding:10px 18px;font-size:clamp(14px,2.4vmin,18px);line-height:1.5;max-width:min(560px,100%)}
.howto b{color:var(--pink-d)}

#songList{display:flex;flex-direction:column;gap:12px;width:min(560px,100%)}
.song{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:14px;text-align:left;background:#fff;border:0;border-radius:24px;
  padding:10px 16px 10px 12px;cursor:pointer;box-shadow:0 6px 0 rgba(91,51,72,.16);color:var(--ink);transition:transform .08s,box-shadow .08s}
.song:active{transform:translateY(5px);box-shadow:0 1px 0 rgba(91,51,72,.16)}
.song .face{width:clamp(54px,11vmin,76px);aspect-ratio:1;border-radius:50%;background:var(--c);padding:5px;flex:none}
.song .face svg{width:100%;height:100%;display:block}
.song b{display:block;font-family:var(--display);font-weight:400;font-size:clamp(18px,3.6vmin,26px)}
.song small{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:clamp(12px,2.1vmin,15px);color:var(--ink-soft);margin-top:3px}
.pill{border-radius:999px;padding:1px 10px;color:#fff;font-size:.95em}
.pill.e{background:var(--mint)}.pill.n{background:var(--l1)}.pill.h{background:var(--pink)}
.bstars{font-size:clamp(15px,3vmin,24px);color:var(--sun);letter-spacing:1px;white-space:nowrap;text-shadow:0 2px 0 rgba(224,155,0,.25)}
.bstars .off{color:#ecdce4;text-shadow:none}

#wardrobeGrid{width:min(640px,100%);display:flex;flex-direction:column;gap:10px}
.wgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;width:100%}
.wtop{display:flex;align-items:center;justify-content:center;gap:14px;width:min(640px,100%)}
#wPreview{height:clamp(150px,26vh,240px);aspect-ratio:260/380;flex:none}
#wPreview svg{width:100%;height:100%;overflow:visible}
.wtop .howto{flex:0 1 auto}
#wTabs{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;width:min(640px,100%)}
.wtab{font-family:var(--display);font-size:14px;border:0;border-radius:999px;padding:.45em .95em;background:#fff;color:var(--ink);box-shadow:0 3px 0 rgba(91,51,72,.15);cursor:pointer}
.wtab.sel{background:var(--pink);color:#fff;box-shadow:0 3px 0 var(--pink-d)}
.wtab:focus-visible{outline:4px solid var(--sky);outline-offset:2px}
.catRow{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;width:min(560px,100%)}
.song.lock{cursor:default;opacity:.75;background:#f7f2f5}
.song.lock .face svg{filter:grayscale(1)}
.song.lock small span:last-child{color:var(--ink-soft)}
.wsec{margin:8px 0 0;font-family:var(--display);font-weight:400;font-size:clamp(17px,3.2vmin,22px);color:var(--pink-d);text-align:left;-webkit-text-stroke:5px #fff;paint-order:stroke fill}
.outfit em.need{font-size:.85em;line-height:1.3}
#modeRow .mode{font-family:var(--display);font-size:clamp(14px,2.8vmin,18px);border:0;border-radius:999px;padding:.5em 1.1em;cursor:pointer;background:#fff;color:var(--ink);box-shadow:0 4px 0 rgba(91,51,72,.18)}
#modeRow .mode.sel{background:var(--pink);color:#fff;box-shadow:0 4px 0 var(--pink-d)}
#modeRow .mode.hardm.sel{background:#6a4fd0;box-shadow:0 4px 0 #3f2b91}
#modeRow .mode.lock{opacity:.6;cursor:default}
#modeRow .mode:focus-visible{outline:4px solid var(--sky);outline-offset:3px}
#modeHint.pop{animation:bpop .35s}
#app.hard{--sky1:#3a3580;--sky2:#c07ad0}
#app.hard #bg .hill{filter:brightness(.6) saturate(.8)}
.outfit{background:#fff;border:0;border-radius:22px;padding:8px 6px 10px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;
  box-shadow:0 5px 0 rgba(91,51,72,.16);font-size:clamp(12px,2.1vmin,15px);color:var(--ink)}
.outfit svg{display:block;width:100%;height:clamp(84px,17vh,150px);max-width:100%}
.outfit{min-width:0}
.outfit span{max-width:100%;overflow-wrap:anywhere}
.outfit.sel{outline:5px solid var(--pink);outline-offset:-2px}
.outfit.lock svg{filter:grayscale(1) brightness(1.15);opacity:.55}
.outfit.lock{cursor:default}
.outfit em{font-style:normal;color:var(--ink-soft)}

#result .stars{display:flex;gap:4px;font-size:clamp(40px,10vmin,78px);line-height:1}
#result .stars i{font-style:normal;color:#ecdce4;display:inline-block;-webkit-text-stroke:6px #fff;paint-order:stroke fill}
#result .stars i.on{color:var(--sun);animation:starin .6s cubic-bezier(.3,1.6,.5,1) both;filter:drop-shadow(0 5px 0 rgba(224,155,0,.35))}
@keyframes starin{0%{scale:0;rotate:-90deg}100%{scale:1;rotate:0}}
#result .big{font-family:var(--display);font-size:clamp(34px,8vmin,64px);color:var(--pink-d);font-variant-numeric:tabular-nums;-webkit-text-stroke:8px #fff;paint-order:stroke fill;line-height:1}
#result .stats{display:grid;grid-template-columns:repeat(5,auto);gap:8px 18px;background:#fff;border-radius:20px;padding:10px 20px;font-size:clamp(13px,2.4vmin,17px)}
#result .stats b{display:block;font-size:1.5em;font-family:var(--display);font-weight:400;font-variant-numeric:tabular-nums}

/* dress fabric patterns (ids are unique per colour so several SVGs on one page never clash) */
const patId = o => `pat_${o.pattern.type}_${(o.dress + o.pattern.c).replace(/[^0-9a-z]/gi, '')}`;
function patternDef(o) {
  if (!o.pattern) return '';
  const b = o.dress, c = o.pattern.c;
  const P = {
    dots:   [16, `<circle cx="4" cy="4" r="2.8" fill="${c}"/><circle cx="12" cy="12" r="2.8" fill="${c}"/>`],
    stripe: [12, `<rect y="0" width="12" height="5" fill="${c}"/>`],
    hearts: [22, `<path d="${heartPath(11, 11, 5)}" fill="${c}"/>`],
    seeds:  [14, `<ellipse cx="4" cy="4" rx="1.3" ry="2.1" fill="${c}"/><ellipse cx="11" cy="11" rx="1.3" ry="2.1" fill="${c}"/>`],
    check:  [20, `<rect width="10" height="20" fill="${c}" opacity=".45"/><rect width="20" height="10" fill="${c}" opacity=".45"/>`],
  }[o.pattern.type];
  return `<pattern id="${patId(o)}" width="${P[0]}" height="${P[0]}" patternUnits="userSpaceOnUse"><rect width="${P[0]}" height="${P[0]}" fill="${b}"/>${P[1]}</pattern>`;
}

/* one braid from (x0,y0) to (x1,y1): overlapping, alternately tilted lobes + tuft + hair tie */
function braidSVG(x0, y0, x1, y1, n, hair, hi, tie) {
  let s = '';
  for (let i = 0; i < n; i++) {
    const t = i / (n - 1), x = x0 + (x1 - x0) * t, y = y0 + (y1 - y0) * t, rx = 16 - 4 * t;
    s += `<ellipse cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" rx="${rx.toFixed(1)}" ry="${(rx * .78).toFixed(1)}" transform="rotate(${i % 2 ? 32 : -26} ${x.toFixed(1)} ${y.toFixed(1)})" fill="${hair}"/>
      <path d="M${(x - rx * .5).toFixed(1)} ${(y - 2).toFixed(1)} Q${x.toFixed(1)} ${(y + (i % 2 ? 5 : -5)).toFixed(1)} ${(x + rx * .5).toFixed(1)} ${(y + 2).toFixed(1)}" stroke="${hi}" stroke-width="2.5" fill="none" stroke-linecap="round" opacity=".7"/>`;
  }
  const X = x1, Y = y1;
  s += `<path d="M${X - 7} ${Y + 8} Q${X - 12} ${Y + 28} ${X - 4} ${Y + 40} Q${X + 2} ${Y + 30} ${X + 2} ${Y + 40} Q${X + 10} ${Y + 26} ${X + 6} ${Y + 8} Z" fill="${hair}"/>${bowSVG(X, Y + 8, -10, tie, .72)}`;
  return s;
}

   Songs (melody = what the player "plays" by tapping)
   ===================================================== */
const NOTE_BASE = { C:0, D:2, E:4, F:5, G:7, A:9, B:11 };
function noteToMidi(n) {
  const m = /^([A-G])(#|b)?(\d)$/.exec(n);
  return 12 * (parseInt(m[3], 10) + 1) + NOTE_BASE[m[1]] + (m[2] === '#' ? 1 : m[2] === 'b' ? -1 : 0);
}
function parseMelody(str) {
  let beat = 0; const notes = [];
  for (const tok of str.trim().split(/\s+/)) {
    const [n, d] = tok.split(':'); const dur = parseFloat(d);
    if (n !== 'r') notes.push({ beat, midi: noteToMidi(n), dur });
    beat += dur;
  }
  return { notes, total: beat };
}

/* build note charts: lane = pitch rank quantised to 4 lanes (low → high) */
for (const s of SONGS) {
  const mel = parseMelody(s.melody);
  const uniq = [...new Set(mel.notes.map(n => n.midi))].sort((a, b) => a - b);
  /* few distinct pitches (≤4): spread them over the outer lanes too, so every lane gets used */
  const laneOf = midi => { const r = uniq.indexOf(midi);
    return uniq.length <= 4 && uniq.length > 1 ? Math.round(r * 3 / (uniq.length - 1)) : Math.min(3, Math.floor(r * 4 / uniq.length)); };
  s.notes = mel.notes.map(n => ({ ...n, lane: laneOf(n.midi) }));
  /* むずかしいモード: long notes get an extra tap halfway through, in the mirrored lane */
  s.hardNotes = [];
  for (const n of s.notes) {
    s.hardNotes.push(n);
    if (n.dur >= 1) s.hardNotes.push({ beat:n.beat + n.dur / 2, midi:n.midi, dur:n.dur / 2, lane:3 - n.lane });
  }
  s.melBeats = mel.total;
  s.introBeats = 4;
  s.bpb = s.bpb || 4;                           // beats per bar (3 = waltz time)
  s.melBars = Math.ceil(mel.total / s.bpb);
  s.totalBars = 1 + s.melBars + 1;              // count-in + melody + outro
}

/* =====================================================
   Audio engine (Web Audio, all sounds synthesised)
   ===================================================== */
const Sound = {
  ac:null,
  lat: 0,
  /* how late the speaker actually plays what we schedule (Bluetooth / phones), capped */
  measureLatency() { if (this.ac) this.lat = Math.min(.3, Math.max(0, (this.ac.outputLatency || 0) + (this.ac.baseLatency || 0))); },
  init() {
    try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) { /* iPhone: play even in silent mode */ }
    if (this.ac) { if (this.ac.state === 'suspended') this.ac.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    const ac = this.ac = new AC();
    const comp = ac.createDynamicsCompressor();
    this.master = ac.createGain(); this.master.gain.value = .9;
    this.master.connect(comp); comp.connect(ac.destination);
    this.bus = ac.createGain(); this.bus.gain.value = .5; this.bus.connect(this.master);   // backing track
    this.lead = ac.createGain(); this.lead.gain.value = 1; this.lead.connect(this.master);   // player's melody
    this.menuBus = ac.createGain(); this.menuBus.gain.value = 0.0001; this.menuBus.connect(this.master);   // menu BGM (faded in/out)
    const len = ac.sampleRate * 0.5, buf = ac.createBuffer(1, len, ac.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    this.noiseBuf = buf;
  },
  now() { return this.ac ? this.ac.currentTime : 0; },
  mtof(m) { return 440 * Math.pow(2, (m - 69) / 12); },
  tone(t, f, dur, o = {}) {
    const ac = this.ac, osc = ac.createOscillator(), g = ac.createGain();
    osc.type = o.type || 'sine'; osc.frequency.setValueAtTime(f, t);
    if (o.to) osc.frequency.exponentialRampToValueAtTime(o.to, t + (o.glide || dur));
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(o.vol || .2, t + (o.atk || .006));
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(g); g.connect(o.dest || this.bus);
    osc.start(t); osc.stop(t + dur + .05);
  },
  noise(t, dur, type, freq, vol) {
    const ac = this.ac, src = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
    src.buffer = this.noiseBuf; f.type = type; f.frequency.value = freq;
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(f); f.connect(g); g.connect(this.bus); src.start(t); src.stop(t + dur + .02);
  },
  kick(t)  { this.tone(t, 150, .22, { to:45, glide:.12, vol:.9, atk:.002 }); },
  snare(t) { this.noise(t, .13, 'bandpass', 1900, .55); this.tone(t, 210, .08, { type:'triangle', vol:.25 }); },
  hat(t, v = .16) { this.noise(t, .045, 'highpass', 8000, v); },
  tick(t, hi) { this.tone(t, hi ? 1568 : 1046, .09, { type:'triangle', vol:.35 }); },
  bass(t, m, dur) { this.tone(t, this.mtof(m), dur, { type:'triangle', vol:.5, atk:.008 }); },
  pluck(t, m, dur, v = .07) { this.tone(t, this.mtof(m), dur, { type:'triangle', vol:v }); },
  /* marimba-ish melody note played when the child taps correctly */
  melody(midi, when, perfect) {
    if (!this.ac) return;
    const t = when || this.ac.currentTime, f = this.mtof(midi + 12);
    this.tone(t, f, .55, { type:'triangle', vol:.42, atk:.004, dest:this.lead });
    this.tone(t, f * 2, .22, { type:'sine', vol:.16, dest:this.lead });
    this.tone(t, f * 4.01, .09, { type:'sine', vol:.07, dest:this.lead });
    if (perfect) this.tone(t + .01, f * 4, .35, { type:'sine', vol:.05, dest:this.lead });
  },
  blip() { if (this.ac) this.tone(this.ac.currentTime, 330, .07, { type:'sine', vol:.05, dest:this.lead }); },
  fanfare() {
    if (!this.ac) return;
    const t = this.ac.currentTime + .05;
    [60, 64, 67, 72, 76].forEach((m, i) => this.tone(t + i * .09, this.mtof(m + 12), .5, { type:'triangle', vol:.3, dest:this.lead }));
    [72, 76, 79].forEach(m => this.tone(t + .5, this.mtof(m + 12), 1, { type:'triangle', vol:.18, dest:this.lead }));
  },

  /* backing-track scheduler: 8th-note steps, look-ahead */
  startSong(song, t0) {
    this.stopSong();
    const spb = 60 / song.bpm, step = spb / 2, bs = song.bpb * 2;       // 8th-note steps; bs = steps per bar
    const melEnd = 8 + song.melBars * bs, total = melEnd + 8;           // 4-beat count-in + melody + outro
    let i = 0;
    const chordAt = (bar, s) => {
      const parts = song.chords[Math.min(bar, song.chords.length - 1)].split(' ');
      return CHORDS[parts[Math.min(parts.length - 1, Math.floor(s / (bs / parts.length)))]];
    };
    const play = (n, t) => {
      const st = song.style;
      if (n < 8) {                                       // count-in bar: ticks + soft hats
        if (n % 2 === 0) this.tick(t, n === 6);
        else if (n > 3) this.hat(t, .1);
        return;
      }
      if (n >= melEnd) {                                 // outro: one big happy chord
        if (n === melEnd) {
          const last = song.chords[song.chords.length - 1].split(' '), ch = CHORDS[last[last.length - 1]];
          this.kick(t); this.snare(t); ch.tri.forEach(m => this.pluck(t, m, 1.6, .12)); this.bass(t, ch.root, 1.6);
        }
        return;
      }
      const m = n - 8, s = m % bs, ch = chordAt(Math.floor(m / bs), s);
      if (st.k[s]) this.kick(t);
      if (st.s[s]) this.snare(t);
      if (st.h[s]) this.hat(t, s % 2 ? .14 : .2);
      if (st.b[s] !== null && st.b[s] !== undefined) this.bass(t, ch.root + st.b[s], step * 1.8);
      if (st.c[s]) ch.tri.forEach(m => this.pluck(t, m, step * 1.5));
    };
    this.timer = setInterval(() => {
      const lim = this.ac.currentTime + .35;
      while (i < total && t0 + i * step < lim) { play(i, t0 + i * step); i++; }
      if (i >= total) this.stopSong();
    }, 30);
  },
  menuOn() {
    if (!this.ac || this.menuTimer) return;
    const ac = this.ac, now = ac.currentTime, step = 60 / MENU_BGM.bpm / 2, g = this.menuBus.gain;
    g.cancelScheduledValues(now); g.setValueAtTime(Math.max(g.value, 0.0001), now); g.exponentialRampToValueAtTime(.5, now + .8);
    const t0 = now + .12; let i = 0;
    this.menuTimer = setInterval(() => {
      const lim = ac.currentTime + .35;
      while (t0 + i * step < lim) { this.menuStep(i % MENU_BGM.steps, t0 + i * step, step); i++; }
    }, 40);
  },
  menuOff() {
    if (!this.menuTimer) return;
    clearInterval(this.menuTimer); this.menuTimer = null;
    const now = this.ac.currentTime, g = this.menuBus.gain;
    g.cancelScheduledValues(now); g.setValueAtTime(Math.max(g.value, 0.0001), now); g.exponentialRampToValueAtTime(0.0001, now + .35);
  },
  menuStep(s, t, step) {
    const bar = Math.floor(s / 8), parts = MENU_BGM.chords[bar].split(' ');
    const ch = CHORDS[parts[Math.min(parts.length - 1, Math.floor((s % 8) / (8 / parts.length)))]];
    const d = this.menuBus;
    if (s % 4 === 0) this.tone(t, this.mtof(ch.root), step * 3, { type:'triangle', vol:.32, atk:.01, dest:d });
    if (s % 4 === 2) ch.tri.forEach(m => this.tone(t, this.mtof(m), step * 2.2, { type:'triangle', vol:.05, atk:.01, dest:d }));
    const n = MENU_BGM.byStep[s];
    if (n) {   // music-box bell
      const f = this.mtof(n.midi), len = Math.max(.5, n.dur * step * 2 + .3);
      this.tone(t, f, len, { type:'sine', vol:.2, atk:.004, dest:d });
      this.tone(t, f * 2, len * .5, { type:'sine', vol:.06, atk:.004, dest:d });
      this.tone(t, f * 3.01, .12, { type:'sine', vol:.03, atk:.002, dest:d });
    }
  },
  stopSong() { if (this.timer) { clearInterval(this.timer); this.timer = null; } },
  suspend() { if (this.ac) this.ac.suspend(); },
  resume() { if (this.ac) this.ac.resume(); },
};

/* =====================================================
   Save data (best effort — works without storage too)
   ===================================================== */
const $ = id => document.getElementById(id);
const store = {
  data: { best:{}, outfit:0, acc:{ ...DEFAULT_ACC }, mode:'normal' },
  load() { try { const s = localStorage.getItem('dobutsuRhythm.v1'); if (s) Object.assign(this.data, JSON.parse(s)); } catch (e) { /* ignore */ } },
  save() { try { localStorage.setItem('dobutsuRhythm.v1', JSON.stringify(this.data)); } catch (e) { /* ignore */ } },
};
store.load();
const totalStars = () => Object.values(store.data.best).reduce((a, b) => a + (b.stars || 0), 0);
const MAX_STARS = 5;
const bestKey = (song, hard) => hard ? song.id + '@hard' : song.id;
const fiveCount = () => SONGS.filter(s => ((store.data.best[s.id] || {}).stars || 0) >= MAX_STARS).length;
const HARD_NEED = 8;   // ★5 songs needed; once opened it stays open even when new songs are added
const hardUnlocked = () => {
  if (!store.data.hardOpen && fiveCount() >= HARD_NEED) { store.data.hardOpen = true; store.save(); }
  return !!store.data.hardOpen;
};
const isHard = () => store.data.mode === 'hard' && hardUnlocked();
const outfitNow = () => { const o = OUTFITS[store.data.outfit]; return o && o.need <= totalStars() ? o : OUTFITS[0]; };
/* her whole look: accessories per slot + hairstyle, hair colour, shoes — only things she has earned */
const accNow = () => {
  const a = { ...DEFAULT_ACC, ...(store.data.acc || {}) }, t = totalStars();
  for (const sl of SLOTS) { const x = ACCS.find(i => i.id === a[sl.id] && i.slot === sl.id); if (!x || x.need > t) a[sl.id] = null; }
  const ok = (list, id, def) => { const x = list.find(i => i.id === id); return x && (x.need || 0) <= t ? id : def; };
  a.hair = ok(HAIRSTYLES, a.hair, 'braid'); a.hairColor = ok(HAIR_COLORS, a.hairColor, 'brown'); a.shoes = ok(SHOES, a.shoes, 'red');
  return a;
};
const starText = (n, max = MAX_STARS) => Array.from({ length: max }, (_, i) => `<span class="${i < n ? '' : 'off'}">★</span>`).join('');

/* song tiers: ふつう opens when every かんたん song has ★4+, むずかしい when every ふつう song has ★4+.
   Once open, a tier stays open (new songs never re-lock it); songs already played stay playable. */
const TIER_STARS = 4, LEVEL_NAME = ['', 'かんたん', 'ふつう', 'むずかしい'];
const normalStars = s => ((store.data.best[s.id] || {}).stars || 0);
const tierProgress = lv => { const list = SONGS.filter(s => s.level === lv - 1); return [list.filter(s => normalStars(s) >= TIER_STARS).length, list.length]; };
function tierOpen(lv) {
  if (lv <= 1) return true;
  const t = store.data.tiers || (store.data.tiers = {});
  if (!t[lv] && tierOpen(lv - 1)) { const [a, b] = tierProgress(lv); if (a >= b) { t[lv] = true; store.save(); } }
  return !!t[lv];
}
const songOpen = s => tierOpen(s.level) || !!store.data.best[s.id];
function renderSongs() {
  const hard = isHard(), open = hardUnlocked();
  $('app').classList.toggle('hard', hard);
  if (hard) setSky(HARD_SKY); else setSky(null);
  $('modeRow').innerHTML = `<button class="mode${hard ? '' : ' sel'}" data-mode="normal">ノーマルモード</button>
    <button class="mode hardm${hard ? ' sel' : ''}${open ? '' : ' lock'}" data-mode="hard" ${open ? '' : 'aria-disabled="true"'}>${open ? '' : '🔒 '}むずかしいモード</button>`;
  $('modeHint').innerHTML = open
    ? (hard ? 'どうぶつが はやく おちてきて、ノーツも ふえるよ！ はんていも きびしめ。' : 'むずかしいモードが あそべるよ！')
    : `${HARD_NEED}きょくで ★${MAX_STARS} を とると むずかしいモードが あそべるよ（いま <b>${fiveCount()}</b> / ${HARD_NEED} きょく）`;
  const cat = store.data.cat || 'all';
  $('catRow').innerHTML = SONG_CATS.map(c => `<button class="wtab${c.id === cat ? ' sel' : ''}" data-cat="${c.id}" type="button">${c.name}</button>`).join('');
  $('songList').innerHTML = SONGS.map((s, i) => {
    if (cat !== 'all' && s.cat !== cat) return '';
    const b = store.data.best[bestKey(s, hard)];
    const cls = ['', 'e', 'n', 'h'][s.level];
    if (!songOpen(s)) {
      const [a, n] = tierProgress(s.level);
      return `<button class="song lock" data-i="${i}" aria-disabled="true" style="--c:#d9ccd4">
      <span class="face">${animalSVG(ANIMALS[s.animal].kind)}</span>
      <span><b>${s.name}</b><small><span class="pill ${cls}">${s.levelName}</span><span>🔒 ${LEVEL_NAME[s.level - 1]}の きょくを ぜんぶ ★${TIER_STARS}いじょうで あそべるよ（いま ${a} / ${n}）</span></small></span>
      <span class="bstars"></span></button>`;
    }
    return `<button class="song" data-i="${i}" style="--c:${LANE_COLORS[s.animal]}">
      <span class="face">${animalSVG(ANIMALS[s.animal].kind)}</span>
      <span><b>${s.name}</b><small><span class="pill ${cls}">${s.levelName}</span><span>${s.bpm} BPM</span>${b && b.score ? `<span>ハイスコア ${b.score.toLocaleString()}</span>` : ''}</small></span>
      <span class="bstars">${starText(b ? b.stars : 0)}</span></button>`;
  }).join('');
}
const CROP = { head:'40 0 180 200', face:'62 78 136 104', neck:'62 150 136 136', hand:'140 110 120 190', shoes:'78 296 104 66', color:'40 0 180 200' };
const WTABS = [
  { id:'dress', name:'ドレス' }, { id:'shoes', name:'くつ' }, { id:'hair', name:'かみがた' }, { id:'color', name:'かみのいろ' },
  { id:'head', name:'かみかざり' }, { id:'face', name:'かお' }, { id:'neck', name:'ネックレス' }, { id:'hand', name:'もちもの' },
];
let wardrobeTab = 'dress';
function renderWardrobe() {
  const total = totalStars(), o = outfitNow(), a = accNow();
  const lockTxt = need => `★ ${need}こで ゲット${need > SONGS.length * MAX_STARS ? '（むずかしいモードの★も かぞえるよ）' : ''}`;

      + (locked ? `<em class="need">${lockTxt(need)}</em>` : `<em>${sel ? onTxt : offTxt}</em>`) + '</button>';
  };
  const byNeed = list => list.map((x, i) => [x, i]).sort((p, q) => (p[0].need || 0) - (q[0].need || 0));

    case 'shoes':

    case 'hair':

    case 'color':
      html = byNeed(HAIR_COLORS).map(([x]) => card(`data-kind="style" data-key="hairColor" data-id="${x.id}"`, a.hairColor === x.id, x.need, girlSVG(o, { ...a, ...plain, hairColor:x.id }, CROP.color), x.name, 'このいろ', 'そめてみる')).join(''); break;
    default: {
      const sl = wardrobeTab;
      html = card(`data-kind="acc" data-slot="${sl}" data-id=""`, !a[sl], 0, girlSVG(o, { ...a, ...plain }, CROP[sl]), 'なし', 'えらんでいるよ', 'はずす')
        + byNeed(ACCS.filter(x => x.slot === sl)).map(([x]) => card(`data-kind="acc" data-slot="${sl}" data-id="${x.id}"`, a[sl] === x.id, x.need,
          girlSVG(o, { ...a, ...plain, [sl]:x.id }, CROP[sl]), x.name, 'つけているよ', 'つけてみる')).join('');

/* =====================================================
   Game
   ===================================================== */
const WIN_NORMAL = { perfect:.08, good:.13, ok:.18 }, WIN_HARD = { perfect:.06, good:.10, ok:.14 };
let WIN = WIN_NORMAL;
const cv = $('cv'), ctx = cv.getContext('2d');
let W = 0, H = 0, dpr = 1, noteR = 30, hitY = 0;
const G = {
  state:'idle', song:null, notes:[], lanes:[[], [], [], []], ptr:[0, 0, 0, 0], score:0, combo:0, maxCombo:0, missRun:0, perfRun:0,
  cnt:{ p:0, g:0, o:0, m:0 }, t0:0, spb:.5, endT:0, cdBeat:-99, parts:[], flash:[0, 0, 0, 0],
};

function layout() {
  const r = $('lanesWrap').getBoundingClientRect();
  W = r.width; H = r.height; dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  noteR = Math.max(18, Math.min(W / 4 * .4, 46, H * .075));
  const D = noteR * 2.3;
  $('lanesWrap').style.setProperty('--padD', D + 'px');
  hitY = H - 10 - D / 2;
  $('judge').style.top = Math.max(60, hitY - noteR * 3.3) + 'px';
}
window.addEventListener('resize', layout);

const curT = () => Sound.now() - G.t0 - Sound.lat;   // align visuals + judging with what the ear hears

function retrigger(el, cls) { el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); }
let girlTimer = 0;
function girlState(name, ms) {
  const g = girlEl(); if (!g) return;
  g.classList.remove('s-happy', 's-oops'); if (name) g.classList.add('s-' + name);
  clearTimeout(girlTimer); girlTimer = setTimeout(() => { g.classList.remove('s-happy', 's-oops'); }, ms);
}
function girlJump() { const g = girlEl(); if (g) retrigger(g, 'jump'); }
function say(text) { const b = $('bubble'); b.textContent = text; retrigger(b, 'pop'); }

function showJudge(text, color) {
  const j = $('judge'); j.textContent = text; j.style.color = color; retrigger(j, 'show');
}
function updateCombo(pop) {
  const c = $('combo'); c.classList.toggle('on', G.combo >= 2);
  c.firstElementChild.textContent = G.combo; if (pop) retrigger(c, 'pop');
}

function burst(x, y, n, spread = 1) {
  const chars = ['★', '♥', '♪', '✦'], cols = ['#ffc93c', '#ff6fa5', '#43c59e', '#5aa9ff', '#b98cff'];
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, sp = (60 + Math.random() * 160) * spread;
    G.parts.push({ x, y, vx:Math.cos(a) * sp, vy:Math.sin(a) * sp - 90, life:0, max:.55 + Math.random() * .4,
      ch:chars[i % chars.length], col:cols[(Math.random() * cols.length) | 0], size:14 + Math.random() * 14 });
  }
}
const MILESTONES = { 10:'いいちょうし♪', 20:'すごーい！ フィーバー！', 30:'かっこいい〜！', 50:'てんさい！！', 75:'ミラクル！', 100:'ひゃくコンボ！！', 150:'でんせつ！！' };

function grade(dt) { const a = Math.abs(dt); return a <= WIN.perfect ? 'p' : a <= WIN.good ? 'g' : 'o'; }
const GRADE = {
  p:{ text:'パーフェクト！', col:'#ffb000', pts:100 },
  g:{ text:'グッド', col:'#ff6fa5', pts:70 },
  o:{ text:'おしい', col:'#5aa9ff', pts:40 },
};

function hitNote(n, dt) {
  const gr = grade(dt), info = GRADE[gr];
  n.judged = n.hit = true;
  G.cnt[gr]++; G.missRun = 0;
  if (gr === 'o') { G.combo = 0; $('app').classList.remove('fever'); }   // おしい breaks the combo
  else G.combo++;
  G.maxCombo = Math.max(G.maxCombo, G.combo);
  G.perfRun = gr === 'p' ? G.perfRun + 1 : 0;
  G.score += info.pts + Math.min(G.combo, 20) * 3;
  $('score').textContent = G.score.toLocaleString();
  Sound.melody(n.midi, 0, gr === 'p');
  const x = (n.lane + .5) * (W / 4);
  burst(x, hitY, gr === 'p' ? 9 : 5);
  G.flash[n.lane] = 1;
  showJudge(info.text, info.col); updateCombo(true);
  cheerFriend(n.lane);
  girlState('happy', 420);
  if (G.combo >= 20) $('app').classList.add('fever');
  if (MILESTONES[G.combo]) {
    say(MILESTONES[G.combo]); girlJump();
    for (let i = 0; i < 6; i++) burst(Math.random() * W, H * (.2 + Math.random() * .4), 5, 1.3);
  } else if (gr === 'p' && G.perfRun === 8) say('ぴったり ぴったり！');
}
function missNote(n) {
  n.judged = n.missed = true; G.cnt.m++; G.combo = 0; G.missRun++; G.perfRun = 0;
  showJudge('あれれ', '#9a8a95'); updateCombo(false);
  $('app').classList.remove('fever');
  girlState('oops', 700);
  if (G.missRun === 3) say('だいじょうぶ！ つぎ いこう！');
}
let friendTimers = [];
function cheerFriend(l) {
  const f = $('friends').children[l]; if (!f) return;
  f.classList.add('cheer'); clearTimeout(friendTimers[l]); friendTimers[l] = setTimeout(() => f.classList.remove('cheer'), 130);
}

function press(l) {
  if (G.state !== 'play') return;
  laneEls[l].classList.add('down'); cheerFriend(l);
  const t = curT(), q = G.lanes[l];
  while (G.ptr[l] < q.length && q[G.ptr[l]].judged) G.ptr[l]++;
  const n = q[G.ptr[l]];
  if (n && Math.abs(t - n.t) <= WIN.ok) hitNote(n, t - n.t);
  else {   // tapping where no animal is breaks the combo (no free combos from mashing)
    Sound.blip(); G.flash[l] = Math.max(G.flash[l], .3);
    if (G.combo) { G.combo = 0; G.perfRun = 0; updateCombo(false); $('app').classList.remove('fever'); }
  }
}
function release(l) { laneEls[l].classList.remove('down'); }

laneEls.forEach((el, l) => {
  el.addEventListener('pointerdown', e => { e.preventDefault(); press(l); });
  ['pointerup', 'pointercancel', 'pointerleave'].forEach(ev => el.addEventListener(ev, () => release(l)));
});
const KEYMAP = { KeyD:0, KeyF:1, KeyJ:2, KeyK:3, ArrowLeft:0, ArrowDown:1, ArrowUp:2, ArrowRight:3, Digit1:0, Digit2:1, Digit3:2, Digit4:3 };
window.addEventListener('keydown', e => {
  if (e.code === 'Escape' || e.code === 'KeyP') { if (G.state === 'play') pauseGame(); else if (G.state === 'pause') resumeGame(); return; }
  const l = KEYMAP[e.code];
  if (l === undefined || G.state !== 'play') return;
  e.preventDefault(); if (!e.repeat) press(l);
});
window.addEventListener('keyup', e => { const l = KEYMAP[e.code]; if (l !== undefined) release(l); });
document.addEventListener('visibilitychange', () => {
  if (document.hidden && G.state === 'play') pauseGame();
  else if (MENU_SCREENS.includes(curScreen)) syncBgm();   // stop the menu music in the background, restart on return
});

function startGame(song) {
  Sound.init();
  if (Sound.ac.state === 'suspended') Sound.ac.resume();
  show(null); layout();
  G.song = song; G.spb = 60 / song.bpm; G.hard = isHard();
  WIN = G.hard ? WIN_HARD : WIN_NORMAL; G.approach = song.approach * (G.hard ? .62 : 1);
  G.notes = (G.hard ? song.hardNotes : song.notes).map(n => ({ t:(song.introBeats + n.beat) * G.spb, lane:n.lane, midi:n.midi, judged:false, hit:false, missed:false }));
  G.lanes = [[], [], [], []]; G.notes.forEach(n => G.lanes[n.lane].push(n));
  G.ptr = [0, 0, 0, 0]; G.score = G.combo = G.maxCombo = G.missRun = G.perfRun = 0;
  G.cnt = { p:0, g:0, o:0, m:0 }; G.parts = []; G.flash = [0, 0, 0, 0]; G.cdBeat = -99;
  G.endT = (song.introBeats + song.melBars * song.bpb + 4) * G.spb + 2.2;
  G.t0 = Sound.now() + .7;
  Sound.startSong(song, G.t0);
  const app = $('app');
  app.style.setProperty('--beat', G.spb + 's'); setSky(G.hard ? HARD_SKY : song.sky);
  app.classList.remove('fever'); app.classList.toggle('hard', G.hard);
  $('score').textContent = '0'; $('progFill').style.width = '0'; updateCombo(false); $('judge').textContent = '';
  say(['よーし、がんばろう！', 'いっしょに おどろう♪', 'どうぶつたちも ノリノリだよ！'][(Math.random() * 3) | 0]);
  Sound.measureLatency();
  keepAwake(true);
  G.state = 'play';
}

/* keep the phone screen on while playing */
let wakeLock = null;
async function keepAwake(on) {
  try {
    if (on && !wakeLock && navigator.wakeLock) { wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', () => { wakeLock = null; }); }
    else if (!on && wakeLock) { await wakeLock.release(); wakeLock = null; }
  } catch (e) { wakeLock = null; }
}

function pauseGame() { if (G.state !== 'play') return; G.state = 'pause'; Sound.suspend(); laneEls.forEach((_, l) => release(l)); show('pause'); }
function resumeGame() { if (G.state !== 'pause') return; show(null); Sound.resume(); G.state = 'play'; }
function quitGame() {
  keepAwake(false);
  Sound.stopSong(); Sound.menuOff(); if (Sound.ac) { Sound.ac.close(); Sound.ac = null; }
  Sound.init();   // fresh audio for the menu music (this runs from a button tap)
  G.state = 'idle'; $('app').classList.remove('fever'); $('count').textContent = ''; renderSongs(); show('select');
}

function update() {
  const t = curT();
  const b = Math.floor(t / G.spb);
  if (b !== G.cdBeat) {
    G.cdBeat = b;
    const c = $('count'), txt = b < 0 ? 'よーい' : b < 3 ? String(3 - b) : b === 3 ? 'スタート！' : '';
    c.textContent = txt; c.style.fontSize = txt.length > 1 ? 'clamp(36px,10vmin,72px)' : '';
    if (txt) retrigger(c, 'tick');
  }
  for (let l = 0; l < 4; l++) {
    const q = G.lanes[l];
    while (G.ptr[l] < q.length) {
      const n = q[G.ptr[l]];
      if (n.judged) { G.ptr[l]++; continue; }
      if (t - n.t > WIN.ok) { missNote(n); G.ptr[l]++; } else break;
    }
  }
  $('progFill').style.width = Math.max(0, Math.min(100, t / (G.endT - 2.2) * 100)) + '%';
  if (t > G.endT) finish();
}

function draw(dt) {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, W, H);
  const laneW = W / 4, t = curT(), v = (hitY + noteR) / G.approach;
  for (let l = 0; l < 4; l++) {
    const x = l * laneW;
    if (G.flash[l] > 0) {
      const g = ctx.createLinearGradient(0, hitY, 0, hitY - H * .55);
      g.addColorStop(0, hexA(LANE_COLORS[l], .55 * G.flash[l])); g.addColorStop(1, hexA(LANE_COLORS[l], 0));
      ctx.fillStyle = g; ctx.fillRect(x, hitY - H * .55, laneW, H * .55 + noteR * 1.3);
      G.flash[l] = Math.max(0, G.flash[l] - dt * 4.5);
    }
    if (l > 0) { ctx.strokeStyle = 'rgba(91,51,72,.12)'; ctx.lineWidth = 2; ctx.setLineDash([7, 9]); ctx.beginPath(); ctx.moveTo(x, 54); ctx.lineTo(x, H - 8); ctx.stroke(); ctx.setLineDash([]); }
  }
  ctx.strokeStyle = 'rgba(255,255,255,.95)'; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(0, hitY); ctx.lineTo(W, hitY); ctx.stroke();
  for (const n of G.notes) {
    if (n.hit) continue;
    const y = hitY - (n.t - t) * v;
    if (y < -noteR * 2 || y > H + noteR * 2) continue;
    const x = (n.lane + .5) * laneW, img = noteImgs[n.lane];
    ctx.globalAlpha = n.missed ? .4 : 1;
    ctx.fillStyle = 'rgba(91,51,72,.16)'; ctx.beginPath(); ctx.ellipse(x, y + noteR * .95, noteR * .8, noteR * .22, 0, 0, 7); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.strokeStyle = LANE_COLORS[n.lane]; ctx.lineWidth = 5;
    ctx.beginPath(); ctx.arc(x, y, noteR, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    if (img.complete) ctx.drawImage(img, x - noteR * .86, y - noteR * .86, noteR * 1.72, noteR * 1.72);
    ctx.globalAlpha = 1;
  }
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (let i = G.parts.length - 1; i >= 0; i--) {
    const p = G.parts[i]; p.life += dt;
    if (p.life > p.max) { G.parts.splice(i, 1); continue; }
    p.vy += 380 * dt; p.x += p.vx * dt; p.y += p.vy * dt;
    ctx.globalAlpha = 1 - p.life / p.max; ctx.fillStyle = p.col; ctx.font = `${p.size}px sans-serif`; ctx.fillText(p.ch, p.x, p.y);
  }
  ctx.globalAlpha = 1;
}
function hexA(hex, a) { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`; }

let lastF = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(.05, (now - lastF) / 1000); lastF = now;
  if (G.state === 'play') { update(); }
  if (G.state === 'play' || G.state === 'pause') draw(G.state === 'play' ? dt : 0);
}
requestAnimationFrame(frame);

/* =====================================================
   Result
   ===================================================== */
function finish() {
  keepAwake(false);
  G.state = 'result'; Sound.stopSong(); $('count').textContent = ''; $('app').classList.remove('fever');
  const song = G.song, n = G.notes.length, c = G.cnt;
  const acc = (c.p + c.g * .7 + c.o * .4) / n;
  const stars = acc >= .95 ? 5 : acc >= .85 ? 4 : acc >= .7 ? 3 : acc >= .5 ? 2 : 1;
  const key = bestKey(song, G.hard), wasOpen = hardUnlocked();
  const before = totalStars(), prev = store.data.best[key] || { score:0, stars:0 };
  store.data.best[key] = { score:Math.max(prev.score, G.score), stars:Math.max(prev.stars, stars) };
  store.save();
  const tiersBefore = [2, 3].filter(lv => (store.data.tiers || {})[lv]);
  const after = totalStars(), newlyOpen = !wasOpen && hardUnlocked();
  const newTiers = [2, 3].filter(lv => tierOpen(lv) && !tiersBefore.includes(lv));
  const unlocked = [...OUTFITS, ...ACCS, ...HAIR_COLORS.map(x => ({ ...x, name:x.name + 'の かみ' })), ...SHOES]
    .filter(x => x.need > before && x.need <= after).sort((p, q) => p.need - q.need);
  setTimeout(() => Sound.fanfare(), 250);

  $('resultStars').innerHTML = [0, 1, 2, 3, 4].map(i => `<i class="${i < stars ? 'on' : ''}" style="animation-delay:${.35 + i * .22}s">★</i>`).join('');
  const badge = $('resultBadge');
  if (c.m === 0 && c.g === 0 && c.o === 0) { badge.hidden = false; badge.textContent = 'ぜんぶ パーフェクト！！'; badge.style.background = '#ff9f1c'; }
  else if (c.m === 0) { badge.hidden = false; badge.textContent = 'フルコンボ！'; badge.style.background = '#43c59e'; }
  else badge.hidden = true;
  $('resultStats').innerHTML = [['パーフェクト', c.p], ['グッド', c.g], ['おしい', c.o], ['ミス', c.m], ['さいだいコンボ', G.maxCombo]]
    .map(([k, v]) => `<div>${k}<b>${v}</b></div>`).join('');
  const msg = ['', 'たのしかったね！ もういちど やってみよう！', 'いいかんじ！ つぎは ★3 を めざそう！', 'じょうず！ リズム ばっちりだね！',
    'すごい すごい！ あと すこしで ★5 だよ！', 'さいこう！！ かんぺきな えんそう！'][stars];
  let extra = '';
  if (unlocked.length) extra += `\n🎁「${unlocked[0].name}」${unlocked.length > 1 ? `など ${unlocked.length}こ` : ''} ゲット！`;
  newTiers.forEach(lv => { extra += `\n🔓 ${LEVEL_NAME[lv]}の きょくが あそべるよ！`; });
  if (newlyOpen) extra += '\n🔓 むずかしいモードが あそべるよ！';
  $('resultMsg').textContent = (G.hard ? '【むずかしいモード】' : '') + msg + extra;
  $('resultMsg').style.whiteSpace = 'pre-line';
  $('resultGirl').innerHTML = girlSVG(outfitNow(), accNow()); $('resultGirl').firstElementChild.classList.add('dance', 's-happy');
  show('result');
  const el = $('resultScore'), target = G.score, t0 = performance.now();
  (function tick(now) { const p = Math.min(1, (now - t0) / 900); el.textContent = Math.round(target * (1 - Math.pow(1 - p, 3))).toLocaleString(); if (p < 1) requestAnimationFrame(tick); })(t0);
}

/* =====================================================
   Save code (あいことば): carries ★ and clothes to a new install, no server needed
   ===================================================== */
/* NEVER reorder: new songs are appended at the end so old codes keep working */
const SAVE_IDS = ['kira', 'mary', 'london', 'march', 'jingle', 'ode', 'rainbow', 'elise', 'kaeru', 'farm', 'gcp', 'alps', 'birthday', 'minuet',
  'hotcross', 'rowboat', 'ieji', 'silent', 'hotaru', 'clementine', 'wewish', 'sakura', 'greensleeves', 'susanna'];
const KANA = 'あいうえおかきくけこさしすせそたちつてとなにぬねのはひふへほまみ';   // 32 letters = 5 bits each
const slotItems = slot => ACCS.filter(x => x.slot === slot);
const checksum = vals => vals.reduce((sum, v, i) => (sum + v * (i + 1)) % 32, 0);
function makeCode() {
  const bits = [], put = (v, n) => { for (let i = n - 1; i >= 0; i--) bits.push((v >> i) & 1); };
  const d = store.data, st = k => Math.min(5, (d.best[k] || {}).stars || 0), a = accNow();
  const idx = slot => a[slot] ? slotItems(slot).findIndex(x => x.id === a[slot]) + 1 : 0;
  const at = (list, id) => Math.max(0, list.findIndex(x => x.id === id));
  /* v3: ★ for ノーマル first; むずかしいモードの★ only when there are any (keeps most codes short) */
  const hasHard = SAVE_IDS.some(id => st(id + '@hard') > 0);
  put(3, 4); put(SAVE_IDS.length, 5); put(hasHard ? 1 : 0, 1);
  SAVE_IDS.forEach(id => put(st(id), 3));
  if (hasHard) SAVE_IDS.forEach(id => put(st(id + '@hard'), 3));
  put(OUTFITS.indexOf(outfitNow()), 4); put(idx('head'), 4); put(idx('neck'), 3); put(idx('hand'), 3); put(idx('face'), 2);
  put(at(HAIRSTYLES, a.hair), 3); put(at(HAIR_COLORS, a.hairColor), 3); put(at(SHOES, a.shoes), 3);
  put(hardUnlocked() ? 1 : 0, 1); put(d.mode === 'hard' ? 1 : 0, 1); put(bgmOn() ? 1 : 0, 1);
  while (bits.length % 5) bits.push(0);
  const vals = [];
  for (let i = 0; i < bits.length; i += 5) vals.push(parseInt(bits.slice(i, i + 5).join(''), 2));
  vals.push(checksum(vals));
  return vals.map(v => KANA[v]).join('');
}
function readCode(text) {
  const chars = [...text.replace(/[\s\u3000・ー-]/g, '')]
    .map(c => { const k = c.charCodeAt(0); return k >= 0x30a1 && k <= 0x30f6 ? String.fromCharCode(k - 0x60) : c; });   // カタカナ → ひらがな
  const vals = chars.map(c => KANA.indexOf(c));
  if (vals.length < 4 || vals.some(v => v < 0)) return null;
  const sum = vals.pop();
  if (checksum(vals) !== sum) return null;
  const bits = [];
  vals.forEach(v => { for (let i = 4; i >= 0; i--) bits.push((v >> i) & 1); });
  let p = 0; const get = n => { let v = 0; for (let i = 0; i < n; i++) v = v * 2 + (bits[p++] || 0); return v; };
  const ver = get(4); if (ver < 1 || ver > 3) return null;
  const n = get(5); if (n > SAVE_IDS.length) return null;
  const best = {};
  if (ver === 3) {
    const hasHard = get(1);
    for (let i = 0; i < n; i++) best[SAVE_IDS[i]] = get(3);
    if (hasHard) for (let i = 0; i < n; i++) best[SAVE_IDS[i] + '@hard'] = get(3);
  } else for (let i = 0; i < n; i++) { best[SAVE_IDS[i]] = get(3); best[SAVE_IDS[i] + '@hard'] = get(3); }
  const r = ver === 1
    ? { best, outfit:get(3), head:get(3), neck:get(2), hand:get(2), face:0, hair:0, hairColor:0, shoes:0 }
    : { best, outfit:get(4), head:get(4), neck:get(3), hand:get(3), face:get(2), hair:get(3), hairColor:get(3), shoes:get(3) };
  Object.assign(r, { hardOpen:get(1), hard:get(1), bgm:get(1) });
  return p <= bits.length ? r : null;
}
function applyCode(r) {
  const d = store.data;
  for (const k in r.best) {
    if (!r.best[k]) continue;
    const cur = d.best[k] || { score:0, stars:0 };
    d.best[k] = { score:cur.score || 0, stars:Math.max(cur.stars || 0, Math.min(5, r.best[k])) };
  }
  if (r.outfit < OUTFITS.length) d.outfit = r.outfit;
  const pick = (slot, i) => (i ? (slotItems(slot)[i - 1] || {}).id || null : null);
  const idOf = (list, i) => (list[i] || list[0]).id;
  d.acc = { head:pick('head', r.head), face:pick('face', r.face), neck:pick('neck', r.neck), hand:pick('hand', r.hand),
    hair:idOf(HAIRSTYLES, r.hair), hairColor:idOf(HAIR_COLORS, r.hairColor), shoes:idOf(SHOES, r.shoes) };
  if (r.hardOpen) d.hardOpen = true;
  d.mode = r.hard ? 'hard' : 'normal'; d.bgm = !!r.bgm;
  store.save();
}
const groupCode = c => c.replace(/(.{4})/g, '$1 ').trim();
function openSave() {
  $('saveCode').textContent = groupCode(makeCode());
  $('saveMsg').hidden = true; $('loadCode').value = '';
  show('save');
}
function saveMsg(text, ok) { const m = $('saveMsg'); m.textContent = text; m.className = 'howto ' + (ok ? 'ok' : 'ng'); m.hidden = false; }
$('btnSave').onclick = openSave;
$('btnSaveBack').onclick = () => show('title');
$('btnCopy').onclick = () => {
  const code = $('saveCode').textContent;
  const done = () => saveMsg('コピーしたよ！ メモアプリや LINE などに はりつけて のこしてね。', true);
  const fallback = () => { const r = document.createRange(); r.selectNodeContents($('saveCode')); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r);
    saveMsg('あいことばを えらんだよ。ながおしして「コピー」してね。紙に かいても OK！', true); };
  try { navigator.clipboard.writeText(code).then(done, fallback); } catch (e) { fallback(); }
};
$('btnLoad').onclick = () => {
  const r = readCode($('loadCode').value);
  if (!r) { saveMsg('あいことばが ちがうみたい。1もじずつ たしかめてね。', false); return; }
  applyCode(r);
  renderGirls();
  $('saveCode').textContent = groupCode(makeCode());
  saveMsg(`きろくが もどったよ！ いま ★ ${totalStars()} こ`, true);
};
$('loadCode').addEventListener('keydown', e => { if (e.key === 'Enter') $('btnLoad').click(); });

/* ask the browser not to clear our records when space runs low */
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) { /* optional */ }

/* installed-app build only (it links a manifest): cache everything so it plays offline */
if ('serviceWorker' in navigator && document.querySelector('link[rel="manifest"]') && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  navigator.serviceWorker.register('sw.js').catch(() => { /* still playable online */ });
}

show('title');
layout();
window.__game = { G, SONGS, press, startGame, store, renderSongs, renderWardrobe, makeCode, readCode };
